name: Rust
permissions:
  contents: read

on:
  push:
  #  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      use_latest_nightly:
        type: boolean
        default: false
  schedule:
    - cron: 0 5,17 * * *

jobs:

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use latest nightly
        if: ${{ inputs.use_latest_nightly }}
        uses: ./.github/actions/use-latest-nightly
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.job }}
      - name: Rustfmt
        run: bazel build --config=rustfmt //...
      - name: Clippy
        run: bazel build --config=clippy //...

  test:
    name: "Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compilation_mode: [ dbg, opt ]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Use latest nightly
        if: ${{ inputs.use_latest_nightly }}
        uses: ./.github/actions/use-latest-nightly
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.job }}-${{ matrix.compilation_mode }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y xorriso e2fsprogs qemu-system-x86
      - name: Test
        run: bazel test -c ${{ matrix.compilation_mode }} //...

  prepare-miri:
    name: "Prepare Miri"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - id: set-matrix
        run: |
          PACKAGES=$(bazel query 'kind(sh_test, //tools/miri:*)' --output label \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix={\"package\":${PACKAGES}}" >> "$GITHUB_OUTPUT"

  miri:
    name: "Miri"
    runs-on: ubuntu-latest
    needs: prepare-miri
    strategy:
      matrix: ${{fromJson(needs.prepare-miri.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Use latest nightly
        if: ${{ inputs.use_latest_nightly }}
        uses: ./.github/actions/use-latest-nightly
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.job }}
      # The Miri shim drives rustup, not the Bazel toolchain, and run_miri.sh
      # copies rust-toolchain.toml into the synthesized workspace. The toolchain
      # that actually runs is therefore the pinned one, not floating nightly.
      - name: Miri Setup
        run: |
          rustup toolchain install \
            "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --component miri
      - name: Miri
        run: bazel test --config=miri ${{ matrix.package }}

  build:
    name: "Build and upload artifacts"
    runs-on: ubuntu-latest
    needs:
      - test
      - miri
    steps:
      - uses: actions/checkout@v7
      - name: Use latest nightly
        if: ${{ inputs.use_latest_nightly }}
        uses: ./.github/actions/use-latest-nightly
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.job }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y xorriso e2fsprogs
      - name: Build
        run: bazel build -c opt //muffinos:iso
      - uses: actions/upload-artifact@v7
        with:
          name: muffin-boot-images
          path: |
            bazel-bin/muffinos/muffinos.iso
